name: CommerceOS CI

on:
  push:
    branches: [foundation, main]
  pull_request:
    branches: [foundation, main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://commerceos:commerceos@localhost:5432/commerceos_test?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: commerceos
          POSTGRES_PASSWORD: commerceos
          POSTGRES_DB: commerceos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commerceos -d commerceos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate lockfile
        run: pnpm install --lockfile-only

      - name: Commit generated lockfile
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Add pnpm lockfile"
          git push

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @commerceos/database generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Prepare test database
        run: pnpm --filter @commerceos/database exec prisma db push --schema prisma/schema.prisma

      - name: API tests
        run: pnpm --filter @commerceos/api test

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
