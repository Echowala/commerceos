services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: commerceos
      POSTGRES_PASSWORD: commerceos
      POSTGRES_DB: commerceos
    ports:
      - "5432:5432"
    volumes:
      - commerceos-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  commerceos-postgres:
